<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen</title>
    <link rel="stylesheet" href="fonts/stylesheet.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="container header_container">
            <h1 class="header_title">Lumen.</h1>
            <nav class="header_mainmenu">
                <ul>
                    <li><a class="mainmenu_link" href="#">О нас</a></li>
                    <li><a class="mainmenu_link" href="#">Каталог</a></li>
                    <li><a class="mainmenu_link" href="#">Обратная связь</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>

       <section class="section banner">
    <div class="container banner_container">
        <div class="banner_text">
            <h2 class="banner_title">LUMEN<br>SHAPE</h2>
            <button class="banner_btn">связаться</button>
        </div>
        <img src="img/Banner.jpg" alt="Лампа">
    </div>
</section>

        <section class="section about">
            <div class="container">
                <!-- TODO: доделать -->
            </div>
        </section>

        <!-- Каталог -->
        <section class="section catalog">
            <div class="container">
                <h2 class="section_title">Каталог</h2>

                <div class="catalog_container">

                    <div class="catalog_card">
                        <img class="card_img" src="img/лампа1.png" alt="Лампа">
                        <h3 class="card_title">Where Shadows Learn to Dance</h3>
                        <p class="card_price">2000 ₽</p>
                        <button class="card_btn">связаться</button>
                        <button class="card_btn-add">+</button>
                    </div>

                    <div class="catalog_card">
                        <img class="card_img" src="img/лампа2.png" alt="Лампа">
                        <h3 class="card_title">The Long Echo of Evening</h3>
                        <p class="card_price">2000 ₽</p>
                        <button class="card_btn">связаться</button>
                        <button class="card_btn-add">+</button>
                    </div>

                    <div class="catalog_card">
                        <img class="card_img" src="img/лампа 3.png" alt="Лампа">
                        <h3 class="card_title">Still</h3>
                        <p class="card_price">2000 ₽</p>
                        <button class="card_btn">связаться</button>
                        <button class="card_btn-add">+</button>
                    </div>

                    <div class="catalog_card">
                        <img class="card_img" src="img/лампа4.png" alt="Лампа">
                        <h3 class="card_title">Dusk</h3>
                        <p class="card_price">2000 ₽</p>
                        <button class="card_btn">связаться</button>
                        <button class="card_btn-add">+</button>
                    </div>

                </div>

                <div class="catalog_button">
                    <button class="catalog_btn" aria-label="Назад">&lt;</button>
                    <button class="catalog_btn" aria-label="Вперёд">&gt;</button>
                </div>
            </div>
        </section>

        
        <section class="section feedback">
            <div class="container">
                <div class="feedback_intro">
                    <h2 class="section_title">ОСТАЛИСЬ<br>ВОПРОСЫ?</h2>
                    <img src="img/биглампа.png" alt="Лампы">
                </div>
                <div class="feedback_main">
                    <form class="feedback_form" action="">
                        <input class="form_input" type="text" name="name" placeholder="имя" required>
                        <input class="form_input" type="tel" name="phone" placeholder="телефон" required>
                        <input class="form_input" type="email" name="mail" placeholder="email" required>
                        <textarea class="form_textarea" name="message" placeholder="напишите ваш вопрос" required></textarea>
                        <button class="form_submit" type="submit">отправить</button>
                    </form>
                </div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <!-- не успел -->
    </footer>

</body>
</html>
